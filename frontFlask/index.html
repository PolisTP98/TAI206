<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>User control panel</h1>
            <p>Flask interface connected to the Docker container (FastAPI)</p>
        </header>

        <section class="form-section">
            <h2>Add a new user</h2>
            <form class="user-form" action="{{ url_for('add_user') }}" method="POST">
                <div class="form-group">
                    <label for="id">ID:</label>
                    <input type="number" id="id" name="id" placeholder="User ID" required>
                </div>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" placeholder="Age" required>
                </div>
                <div class="form-group">
                    <label for="aka">Alias (AKA):</label>
                    <input type="text" id="aka" name="aka" placeholder="User alias" required>
                </div>
                <button type="submit" class="btn-add">Add</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Users</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Alias</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.name }}</td>
                            <td>{{ user.age }}</td>
                            <td>{{ user.aka }}</td>
                            <td>
                                <a href="{{ url_for('update_view', id=user.id) }}" class="btn-action btn-edit">Update</a>
                                <a href="{{ url_for('delete_user', id=user.id) }}" class="btn-action btn-delete" onclick="return confirm('Delete user?');">Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" style="text-align: center; color: red;">No users found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
